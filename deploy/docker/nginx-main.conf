worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log the method and normalized URI path, never the full request target.
    # This prevents AD FS code/state values from reaching container logs.
    log_format main '$remote_addr [$time_local] "$request_method $uri" '
                    '$status $body_bytes_sent $request_time '
                    'upstream_status=$upstream_status '
                    'upstream_response_time=$upstream_response_time '
                    'upstream_addr=$upstream_addr';

    access_log /dev/stdout main;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx-client-temp;
    proxy_temp_path /tmp/nginx-proxy-temp;
    fastcgi_temp_path /tmp/nginx-fastcgi-temp;
    uwsgi_temp_path /tmp/nginx-uwsgi-temp;
    scgi_temp_path /tmp/nginx-scgi-temp;

    include /etc/nginx/conf.d/*.conf;
}
