apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-nemesys-pg-data-pvc
  namespace: nemesys
  labels:
    team: infra
  annotations:
    argocd.argoproj.io/sync-options: Replace=false,Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi