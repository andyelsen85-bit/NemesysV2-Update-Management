apiVersion: v1
kind: Secret
metadata:
  name: nemesys-runtime
type: Opaque
stringData:
  # Replace these values through your cluster's secret management process.
  DATABASE_URL: "postgresql://replace-me"
  SESSION_SECRET: "replace-me"
  NEMESYS_ADMIN_USERNAME: "admin"
  NEMESYS_ADMIN_PASSWORD: "replace-me"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemesys-api
  labels:
    app: nemesys-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nemesys-api
  template:
    metadata:
      labels:
        app: nemesys-api
    spec:
      containers:
        - name: api
          # GitHub Actions publishes this image to GHCR on every main push.
          # Replace the owner if this repository is forked.
          image: ghcr.io/andyelsen85-bit/nemesys-api-server:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          envFrom:
            - secretRef:
                name: nemesys-runtime
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemesys-console
  labels:
    app: nemesys-console
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nemesys-console
  template:
    metadata:
      labels:
        app: nemesys-console
    spec:
      containers:
        - name: console
          # GitHub Actions publishes this image to GHCR on every main push.
          image: ghcr.io/andyelsen85-bit/nemesys-console:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nemesys-console
spec:
  selector:
    app: nemesys-console
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: nemesys-api
spec:
  selector:
    app: nemesys-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nemesys-control-plane
  annotations:
    # Choose the annotation set used by the existing cluster ingress controller.
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
    - hosts:
        - nemesys.example.com
      secretName: nemesys-tls
  rules:
    - host: nemesys.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nemesys-console
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: nemesys-api
                port:
                  name: http
