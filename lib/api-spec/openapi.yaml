openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Control center overview
  - name: clients
    description: Enrolled Windows client services
  - name: software
    description: Software update policies
  - name: audit
    description: Synchronization audit history
  - name: settings
    description: Server configuration
  - name: sync
    description: Client synchronization protocol
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List enrolled clients
      responses:
        "200":
          description: Enrolled clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
  /clients/{id}/revoke:
    post:
      operationId: revokeClient
      tags: [clients]
      summary: Revoke a client certificate
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Revoked client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Client not found
  /clients/{id}/sync-config:
    get:
      operationId: getClientSyncConfig
      tags: [clients]
      summary: Get a client's effective synchronization configuration
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Effective synchronization configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncConfig"
        "404":
          description: Client not found
  /software:
    get:
      operationId: listSoftware
      tags: [software]
      summary: List software update policies
      responses:
        "200":
          description: Software policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SoftwarePolicy"
    post:
      operationId: createSoftware
      tags: [software]
      summary: Create a software update policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SoftwarePolicyInput"
      responses:
        "201":
          description: Created software policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoftwarePolicy"
  /software/{id}:
    patch:
      operationId: updateSoftware
      tags: [software]
      summary: Update a software policy
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SoftwarePolicyInput"
      responses:
        "200":
          description: Updated software policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoftwarePolicy"
        "404":
          description: Software policy not found
  /audit:
    get:
      operationId: listAuditEntries
      tags: [audit]
      summary: List recent synchronization audit entries
      parameters:
        - name: limit
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
  /settings:
      get:
        operationId: getServerSettings
        tags: [settings]
        summary: Get server settings
        responses:
          "200":
            description: Server settings
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ServerSettings"
      patch:
        operationId: updateServerSettings
        tags: [settings]
        summary: Update server settings
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerSettingsInput"
        responses:
          "200":
            description: Updated server settings
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ServerSettings"
  /settings/api-key/rotate:
    post:
      operationId: rotateClientApiKey
      tags: [settings]
      summary: Rotate the shared client API key
      description: Generates a new shared client API key. The plaintext key is returned only in this response so it can be supplied to silent client installation commands.
      responses:
        "200":
          description: Rotated client API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyRotation"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Start an administrator session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        "200":
          description: Authenticated administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
  /auth/me:
    get:
      operationId: getCurrentAdministrator
      tags: [auth]
      summary: Get the current administrator session
      responses:
        "200":
          description: Current administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/password:
    post:
      operationId: changeAdministratorPassword
      tags: [auth]
      summary: Change the administrator password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthPasswordChangeInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the administrator session
      responses:
        "204":
          description: Session ended
  /sync/config:
    get:
      operationId: getSyncConfig
      tags: [sync]
      summary: Get effective client sync configuration
      parameters:
        - name: clientId
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/ClientApiKey"
        - $ref: "#/components/parameters/ClientHostname"
      responses:
        "200":
          description: Effective synchronization configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncConfig"
  /sync/enroll:
    post:
      operationId: enrollClient
      tags: [sync]
      summary: Enroll or refresh a Windows client by hostname
      parameters:
        - $ref: "#/components/parameters/ClientApiKey"
        - $ref: "#/components/parameters/ClientHostname"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientEnrollmentInput"
      responses:
        "200":
          description: Enrolled client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /sync/report:
    post:
      operationId: submitSyncReport
      tags: [sync]
      summary: Submit a client synchronization report
      parameters:
        - $ref: "#/components/parameters/ClientApiKey"
        - $ref: "#/components/parameters/ClientHostname"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncReportInput"
      responses:
        "201":
          description: Report accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntry"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    ClientApiKey:
      name: X-Nemesys-API-Key
      in: header
      required: true
      schema:
        type: string
      description: Shared client API key delivered during silent installation.
    ClientHostname:
      name: X-Nemesys-Hostname
      in: header
      required: true
      schema:
        type: string
      description: Windows hostname/computer name used as client identity.
  schemas:
    ClientEnrollmentInput:
      type: object
      properties:
        address: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthLoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    AuthSession:
      type: object
      required: [username]
      properties:
        username: { type: string }
    AuthPasswordChangeInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8 }
    DashboardSummary:
      type: object
      required: [totalClients, onlineClients, protectedSoftware, syncsToday, latestSync]
      properties:
        totalClients:
          type: number
        onlineClients:
          type: number
        protectedSoftware:
          type: number
        syncsToday:
          type: number
        latestSync:
          type: ["string", "null"]
          format: date-time
    Client:
      type: object
      required: [id, name, hostname, address, status, lastSync, syncVersion, certificateStatus]
      properties:
        id: { type: string }
        name: { type: string }
        hostname: { type: string }
        address: { type: string }
        status:
          type: string
          enum: [online, stale, revoked]
        lastSync:
          type: ["string", "null"]
          format: date-time
        syncVersion: { type: string }
        certificateStatus:
          type: string
          enum: [valid, expiring, revoked]
    IniRule:
      type: object
      required: [section, key, expectedValue]
      properties:
        section: { type: string }
        key: { type: string }
        expectedValue: { type: string }
    ExeCheck:
      type: object
      required: [executable, targetVersion]
      properties:
        executable: { type: string }
        targetVersion: { type: string }
        installCommand: { type: string }
    IniCheck:
      type: object
      required: [filePath, section, key, expectedValue]
      properties:
        filePath: { type: string }
        section: { type: string }
        key: { type: string }
        expectedValue: { type: string }
    SoftwarePolicy:
      type: object
      required: [id, name, executable, targetVersion, ruleType, exeChecks, iniChecks, iniRules, graceSeconds, enabled, lastUpdated]
      properties:
        id: { type: string }
        name: { type: string }
        executable: { type: string }
        targetVersion: { type: string }
        ruleType:
          type: string
          enum: [application, file-version, ini]
        exeChecks:
          type: array
          items: { $ref: "#/components/schemas/ExeCheck" }
        iniChecks:
          type: array
          items: { $ref: "#/components/schemas/IniCheck" }
        iniRules:
          type: array
          items: { $ref: "#/components/schemas/IniRule" }
        graceSeconds: { type: number, minimum: 0 }
        enabled: { type: boolean }
        lastUpdated:
          type: string
          format: date-time
    SoftwarePolicyInput:
      type: object
      required: [name, ruleType, graceSeconds, enabled]
      properties:
        name: { type: string, minLength: 1 }
        executable: { type: string }
        targetVersion: { type: string }
        ruleType:
          type: string
          enum: [application, file-version, ini]
        exeChecks:
          type: array
          items: { $ref: "#/components/schemas/ExeCheck" }
        iniChecks:
          type: array
          items: { $ref: "#/components/schemas/IniCheck" }
        iniRules:
          type: array
          items: { $ref: "#/components/schemas/IniRule" }
        graceSeconds: { type: number, minimum: 0, maximum: 3600 }
        enabled: { type: boolean }
    AuditEntry:
      type: object
      required: [id, clientId, clientName, timestamp, result, applications]
      properties:
        id: { type: string }
        clientId: { type: string }
        clientName: { type: string }
        timestamp:
          type: string
          format: date-time
        result:
          type: string
          enum: [success, warning, rejected]
        applications:
          type: array
          items: { $ref: "#/components/schemas/ApplicationReport" }
    ApplicationReport:
      type: object
      required: [softwareId, softwareName, observedVersion, expectedVersion, compliant]
      properties:
        softwareId: { type: string }
        softwareName: { type: string }
        observedVersion: { type: string }
        expectedVersion: { type: string }
        compliant: { type: boolean }
    ServerSettings:
      type: object
      required: [syncIntervalSeconds, syncPort, adminHttpsEnabled, apiKeyConfigured, apiKeyLastRotatedAt, updateMode, normalCloseTimeoutSeconds, updateModeCloseTimeoutSeconds]
      properties:
        syncIntervalSeconds: { type: number, minimum: 10, maximum: 86400 }
        syncPort: { type: number, minimum: 1, maximum: 65535 }
        adminHttpsEnabled: { type: boolean }
        apiKeyConfigured: { type: boolean }
        apiKeyLastRotatedAt:
          type: ["string", "null"]
          format: date-time
        updateMode: { type: boolean }
        normalCloseTimeoutSeconds: { type: number, minimum: 5, maximum: 3600 }
        updateModeCloseTimeoutSeconds: { type: number, minimum: 1, maximum: 300 }
    ServerSettingsInput:
      type: object
      required: [syncIntervalSeconds, syncPort, adminHttpsEnabled, updateMode, normalCloseTimeoutSeconds, updateModeCloseTimeoutSeconds]
      properties:
        syncIntervalSeconds: { type: number, minimum: 10, maximum: 86400 }
        syncPort: { type: number, minimum: 1, maximum: 65535 }
        adminHttpsEnabled: { type: boolean }
        updateMode: { type: boolean }
        normalCloseTimeoutSeconds: { type: number, minimum: 5, maximum: 3600 }
        updateModeCloseTimeoutSeconds: { type: number, minimum: 1, maximum: 300 }
    ApiKeyRotation:
      type: object
      required: [apiKey, maskedApiKey, rotatedAt]
      properties:
        apiKey: { type: string, minLength: 16 }
        maskedApiKey: { type: string }
        rotatedAt:
          type: string
          format: date-time
    SyncConfig:
      type: object
      required: [clientId, syncIntervalSeconds, configVersion, updateMode, normalCloseTimeoutSeconds, closeOnStartTimeoutSeconds, policies]
      properties:
        clientId: { type: string }
        syncIntervalSeconds: { type: number }
        configVersion: { type: string }
        updateMode: { type: boolean }
        normalCloseTimeoutSeconds: { type: number, minimum: 5, maximum: 3600 }
        closeOnStartTimeoutSeconds: { type: number, minimum: 1, maximum: 3600 }
        policies:
          type: array
          items: { $ref: "#/components/schemas/SoftwarePolicy" }
    SyncReportInput:
      type: object
      required: [clientId, clientName, result, applications]
      properties:
        clientId: { type: string }
        clientName: { type: string }
        result:
          type: string
          enum: [success, warning, rejected]
        applications:
          type: array
          items: { $ref: "#/components/schemas/ApplicationReport" }

