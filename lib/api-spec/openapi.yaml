openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Control center overview
  - name: clients
    description: Enrolled Windows client services
  - name: software
    description: Software update policies
  - name: audit
    description: Latest synchronization status per client
  - name: settings
    description: Server configuration
  - name: users
    description: Administrator user management
  - name: sync
    description: Client synchronization protocol
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List enrolled clients
      responses:
        "200":
          description: Enrolled clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
  /clients/{id}/revoke:
    post:
      operationId: revokeClient
      tags: [clients]
      summary: Revoke a client certificate
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Revoked client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Client not found
  /clients/{id}/sync-config:
    get:
      operationId: getClientSyncConfig
      tags: [clients]
      summary: Get a client's effective synchronization configuration
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Effective synchronization configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncConfig"
        "404":
          description: Client not found
  /software:
    get:
      operationId: listSoftware
      tags: [software]
      summary: List software update policies
      responses:
        "200":
          description: Software policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SoftwarePolicy"
    post:
      operationId: createSoftware
      tags: [software]
      summary: Create a software update policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SoftwarePolicyInput"
      responses:
        "201":
          description: Created software policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoftwarePolicy"
  /software/{id}:
    patch:
      operationId: updateSoftware
      tags: [software]
      summary: Update a software policy
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SoftwarePolicyInput"
      responses:
        "200":
          description: Updated software policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoftwarePolicy"
        "404":
          description: Software policy not found
    delete:
      operationId: deleteSoftware
      tags: [software]
      summary: Delete a software policy
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Software policy deleted
        "404":
          description: Software policy not found
  /audit:
    get:
      operationId: listAuditEntries
      tags: [audit]
      summary: List the latest synchronization status for each client
      parameters:
        - name: limit
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
  /settings:
      get:
        operationId: getServerSettings
        tags: [settings]
        summary: Get server settings
        responses:
          "200":
            description: Server settings
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ServerSettings"
      patch:
        operationId: updateServerSettings
        tags: [settings]
        summary: Update server settings
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerSettingsInput"
        responses:
          "200":
            description: Updated server settings
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ServerSettings"
  /settings/api-key/rotate:
    post:
      operationId: rotateClientApiKey
      tags: [settings]
      summary: Rotate the shared client API key
      description: Generates a new shared client API key. The plaintext key is returned only in this response so it can be supplied to silent client installation commands.
      responses:
        "200":
          description: Rotated client API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyRotation"
  /settings/api-key:
    get:
      operationId: getClientApiKey
      tags: [settings]
      summary: Get the configured shared client API key
      description: Returns the configured key to an authenticated administrator when encrypted key material is available. Legacy hash-only keys are reported as not recoverable.
      responses:
        "200":
          description: Current client API key status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientApiKeyStatus"
    post:
      operationId: saveClientApiKey
      tags: [settings]
      summary: Save a chosen shared client API key
      description: Explicitly saves a supplied key and returns it in full so an administrator can copy it without reinstalling existing clients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyInput"
      responses:
        "200":
          description: Saved client API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyRotation"
  /settings/ldap:
    get:
      operationId: getLdapSettings
      tags: [settings]
      summary: Get LDAP connection settings
      responses:
        "200":
          description: LDAP settings with secret values masked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LdapSettings"
    put:
      operationId: updateLdapSettings
      tags: [settings]
      summary: Save LDAP connection settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LdapSettingsInput"
      responses:
        "200":
          description: Updated LDAP settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LdapSettings"
  /settings/ldap/test:
    post:
      operationId: testLdapConnection
      tags: [settings]
      summary: Test LDAP authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LdapTestInput"
      responses:
        "200":
          description: LDAP diagnostic result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LdapDiagnostic"
  /settings/ssl:
    get:
      operationId: getSslSettings
      tags: [settings]
      summary: Get SSL certificate status
      responses:
        "200":
          description: SSL status with private material masked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SslSettings"
    put:
      operationId: updateSslSettings
      tags: [settings]
      summary: Upload or update the admin panel SSL certificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SslSettingsInput"
      responses:
        "200":
          description: Updated SSL settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SslSettings"
  /users:
    get:
      operationId: listAdministratorUsers
      tags: [users]
      summary: List administrator users
      responses:
        "200":
          description: Administrator users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdministratorUser"
    post:
      operationId: createAdministratorUser
      tags: [users]
      summary: Add an LDAP administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdministratorUserInput"
      responses:
        "201":
          description: Created administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdministratorUser"
  /users/{id}:
    patch:
      operationId: updateAdministratorUser
      tags: [users]
      summary: Enable or disable an administrator
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdministratorUserUpdate"
      responses:
        "200":
          description: Updated administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdministratorUser"
    delete:
      operationId: deleteAdministratorUser
      tags: [users]
      summary: Remove an administrator
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Administrator removed
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Start an administrator session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        "200":
          description: Authenticated administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
  /auth/me:
    get:
      operationId: getCurrentAdministrator
      tags: [auth]
      summary: Get the current administrator session
      responses:
        "200":
          description: Current administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/password:
    post:
      operationId: changeAdministratorPassword
      tags: [auth]
      summary: Change the administrator password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthPasswordChangeInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the administrator session
      responses:
        "204":
          description: Session ended
  /sync/config:
    get:
      operationId: getSyncConfig
      tags: [sync]
      summary: Get effective client sync configuration
      parameters:
        - name: clientId
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/ClientApiKey"
        - $ref: "#/components/parameters/ClientHostname"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Effective synchronization configuration
          headers:
            ETag:
              description: Version of the effective synchronization configuration.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncConfig"
        "304":
          description: Synchronization configuration has not changed
          headers:
            ETag:
              description: Current version of the effective synchronization configuration.
              schema: { type: string }
  /sync/enroll:
    post:
      operationId: enrollClient
      tags: [sync]
      summary: Enroll or refresh a Windows client by hostname
      parameters:
        - $ref: "#/components/parameters/ClientApiKey"
        - $ref: "#/components/parameters/ClientHostname"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientEnrollmentInput"
      responses:
        "200":
          description: Enrolled client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /sync/report:
    post:
      operationId: submitSyncReport
      tags: [sync]
      summary: Submit a client synchronization report
      parameters:
        - $ref: "#/components/parameters/ClientApiKey"
        - $ref: "#/components/parameters/ClientHostname"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncReportInput"
      responses:
        "200":
          description: Latest report for the client accepted and stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntry"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    ClientApiKey:
      name: X-Nemesys-API-Key
      in: header
      required: true
      schema:
        type: string
      description: Shared client API key delivered during silent installation.
    ClientHostname:
      name: X-Nemesys-Hostname
      in: header
      required: true
      schema:
        type: string
      description: Windows hostname/computer name used as client identity.
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
      description: Previously returned synchronization configuration ETag.
  schemas:
    ClientEnrollmentInput:
      type: object
      properties:
        address: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthLoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    AuthSession:
      type: object
      required: [username]
      properties:
        username: { type: string }
    AuthPasswordChangeInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8 }
    DashboardSummary:
      type: object
      required: [totalClients, onlineClients, protectedSoftware, syncsToday, latestSync]
      properties:
        totalClients:
          type: number
        onlineClients:
          type: number
        protectedSoftware:
          type: number
        syncsToday:
          type: number
        latestSync:
          type: ["string", "null"]
          format: date-time
    Client:
      type: object
      required: [id, name, hostname, address, status, lastSync, lastPoll, lastSuccessfulSync, syncVersion, certificateStatus]
      properties:
        id: { type: string }
        name: { type: string }
        hostname: { type: string }
        address: { type: string }
        status:
          type: string
          enum: [online, stale, revoked]
        lastSync:
          type: ["string", "null"]
          format: date-time
        lastPoll:
          type: ["string", "null"]
          format: date-time
        lastSuccessfulSync:
          type: ["string", "null"]
          format: date-time
        syncVersion: { type: string }
        certificateStatus:
          type: string
          enum: [valid, expiring, revoked]
    IniRule:
      type: object
      required: [section, key, expectedValue]
      properties:
        section: { type: string }
        key: { type: string }
        expectedValue: { type: string }
    ExeCheck:
      type: object
      required: [executable, targetVersion]
      properties:
        executable: { type: string }
        targetVersion: { type: string }
        installCommand: { type: string }
    IniCheck:
      type: object
      required: [filePath, section, key, expectedValue]
      properties:
        filePath: { type: string }
        section: { type: string }
        key: { type: string }
        expectedValue: { type: string }
    SoftwarePolicy:
      type: object
      required: [id, name, executable, targetVersion, ruleType, supervisedExecutables, exeChecks, iniChecks, iniRules, normalCloseTimeoutSeconds, updateMode, updateModeCloseTimeoutSeconds, allowPostpone, launchOnExitUpdateMode, launchExecutablePath, launchArguments, updateModeCycleId, enabled, lastUpdated]
      properties:
        id: { type: string }
        name: { type: string }
        executable: { type: string }
        targetVersion: { type: string }
        ruleType:
          type: string
          enum: [application, file-version, ini]
        supervisedExecutables:
          type: array
          description: Executable paths whose running processes are supervised and closed before a managed update.
          items: { type: string }
        exeChecks:
          type: array
          items: { $ref: "#/components/schemas/ExeCheck" }
        iniChecks:
          type: array
          items: { $ref: "#/components/schemas/IniCheck" }
        iniRules:
          type: array
          items: { $ref: "#/components/schemas/IniRule" }
        normalCloseTimeoutSeconds: { type: number, minimum: 1, maximum: 3600, default: 30 }
        updateMode: { type: boolean }
        updateModeCloseTimeoutSeconds: { type: number, minimum: 1, maximum: 300, default: 8 }
        allowPostpone:
          type: boolean
          description: Whether the Windows close-warning dialog lets the user postpone this application update until the next client synchronization.
        launchOnExitUpdateMode: { type: boolean, default: false }
        launchExecutablePath: { type: string, default: "" }
        launchArguments: { type: string, default: "" }
        updateModeCycleId:
          type: string
          description: Server-generated identifier for the current Update Mode cycle.
        enabled: { type: boolean }
        lastUpdated:
          type: string
          format: date-time
    SoftwarePolicyInput:
      type: object
      required: [name, ruleType, normalCloseTimeoutSeconds, enabled]
      properties:
        name: { type: string, minLength: 1 }
        executable: { type: string }
        targetVersion: { type: string }
        ruleType:
          type: string
          enum: [application, file-version, ini]
        supervisedExecutables:
          type: array
          description: Executable paths whose running processes are supervised and closed before a managed update.
          items: { type: string }
        exeChecks:
          type: array
          items: { $ref: "#/components/schemas/ExeCheck" }
        iniChecks:
          type: array
          items: { $ref: "#/components/schemas/IniCheck" }
        iniRules:
          type: array
          items: { $ref: "#/components/schemas/IniRule" }
        normalCloseTimeoutSeconds: { type: number, minimum: 1, maximum: 3600, default: 30 }
        updateMode: { type: boolean }
        updateModeCloseTimeoutSeconds: { type: number, minimum: 1, maximum: 300, default: 8 }
        allowPostpone:
          type: boolean
          default: false
          description: Show a Postpone action in the Windows close-warning dialog for this application.
        launchOnExitUpdateMode: { type: boolean, default: false }
        launchExecutablePath: { type: string, default: "" }
        launchArguments: { type: string, default: "" }
        enabled: { type: boolean }
    AuditEntry:
      type: object
      required: [id, clientId, clientName, timestamp, result, applications]
      properties:
        id: { type: string }
        clientId: { type: string }
        clientName: { type: string }
        timestamp:
          type: string
          format: date-time
        result:
          type: string
          enum: [success, warning, rejected]
        applications:
          type: array
          items: { $ref: "#/components/schemas/ApplicationReport" }
    ApplicationReport:
      type: object
      required: [softwareId, softwareName, observedVersion, expectedVersion, compliant]
      properties:
        softwareId: { type: string }
        softwareName: { type: string }
        observedVersion: { type: string }
        expectedVersion: { type: string }
        compliant: { type: boolean }
    ServerSettings:
      type: object
      required: [syncPort, adminHttpsEnabled, apiKeyConfigured, apiKeyLastRotatedAt]
      properties:
        syncPort: { type: number, minimum: 1, maximum: 65535 }
        adminHttpsEnabled: { type: boolean }
        apiKeyConfigured: { type: boolean }
        apiKeyLastRotatedAt:
          type: ["string", "null"]
          format: date-time
    ServerSettingsInput:
      type: object
      required: [syncPort, adminHttpsEnabled]
      properties:
        syncPort: { type: number, minimum: 1, maximum: 65535 }
        adminHttpsEnabled: { type: boolean }
    ApiKeyRotation:
      type: object
      required: [apiKey, maskedApiKey, rotatedAt]
      properties:
        apiKey: { type: string, minLength: 16 }
        maskedApiKey: { type: string }
        rotatedAt:
          type: string
          format: date-time
    ClientApiKeyStatus:
      type: object
      required: [apiKey, maskedApiKey, configured, recoverable, rotatedAt]
      properties:
        apiKey: { type: ["string", "null"] }
        maskedApiKey: { type: ["string", "null"] }
        configured: { type: boolean }
        recoverable: { type: boolean }
        rotatedAt: { type: ["string", "null"], format: date-time }
    ApiKeyInput:
      type: object
      required: [apiKey]
      properties:
        apiKey: { type: string, minLength: 16, maxLength: 256 }
    LdapSettings:
      type: object
      required: [enabled, url, bindDn, bindPasswordSet, baseDn, userFilter, usernameAttribute, displayNameAttribute, emailAttribute, verifyTlsCertificate, caCertificateInstalled]
      properties:
        enabled: { type: boolean }
        url: { type: string }
        bindDn: { type: string }
        bindPasswordSet: { type: boolean }
        baseDn: { type: string }
        userFilter: { type: string }
        usernameAttribute: { type: string }
        displayNameAttribute: { type: string }
        emailAttribute: { type: string }
        verifyTlsCertificate: { type: boolean }
        caCertificateInstalled: { type: boolean }
    LdapSettingsInput:
      type: object
      required: [enabled, url, bindDn, baseDn, userFilter, usernameAttribute, displayNameAttribute, emailAttribute, verifyTlsCertificate]
      properties:
        enabled: { type: boolean }
        url: { type: string }
        bindDn: { type: string }
        bindPassword: { type: string }
        baseDn: { type: string }
        userFilter: { type: string }
        usernameAttribute: { type: string }
        displayNameAttribute: { type: string }
        emailAttribute: { type: string }
        verifyTlsCertificate: { type: boolean }
        caCertificatePem: { type: string }
    LdapTestInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    LdapDiagnostic:
      type: object
      required: [success, stage, message]
      properties:
        success: { type: boolean }
        stage:
          type: string
          enum: [config, connect, service-bind, search, user-bind, ok]
        message: { type: string }
        details: { type: string }
    SslSettings:
      type: object
      required: [certificateInstalled, privateKeyInstalled, chainInstalled, certificateFingerprint, certificateSubject, certificateExpiresAt, forceHttps, hstsEnabled]
      properties:
        certificateInstalled: { type: boolean }
        privateKeyInstalled: { type: boolean }
        chainInstalled: { type: boolean }
        certificateFingerprint: { type: ["string", "null"] }
        certificateSubject: { type: ["string", "null"] }
        certificateExpiresAt: { type: ["string", "null"], format: date-time }
        forceHttps: { type: boolean }
        hstsEnabled: { type: boolean }
    SslSettingsInput:
      type: object
      required: [certificatePem, privateKeyPem, chainPem, forceHttps, hstsEnabled]
      properties:
        certificatePem: { type: string }
        privateKeyPem: { type: string }
        chainPem: { type: string }
        forceHttps: { type: boolean }
        hstsEnabled: { type: boolean }
    AdministratorUser:
      type: object
      required: [id, username, displayName, email, source, directoryDn, isActive, createdAt]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        email: { type: string }
        source: { type: string, enum: [ldap] }
        directoryDn: { type: ["string", "null"] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    AdministratorUserInput:
      type: object
      required: [username]
      properties:
        username: { type: string, minLength: 1 }
    AdministratorUserUpdate:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean }
    SyncConfig:
      type: object
      required: [clientId, syncIntervalSeconds, configVersion, updateMode, policies]
      properties:
        clientId: { type: string }
        syncIntervalSeconds: { type: number }
        configVersion: { type: string }
        updateMode: { type: boolean }
        policies:
          type: array
          items: { $ref: "#/components/schemas/SoftwarePolicy" }
    SyncReportInput:
      type: object
      required: [clientId, clientName, result, applications]
      properties:
        clientId: { type: string }
        clientName: { type: string }
        result:
          type: string
          enum: [success, warning, rejected]
        applications:
          type: array
          items: { $ref: "#/components/schemas/ApplicationReport" }

